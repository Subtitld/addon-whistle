[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "subtitld-addon-whistle"
version = "0.0.1"
description = "Subtitld add-on: offline speech-to-text with Whistle (Cactus Compute)"
readme = "README.md"
license = { text = "Apache-2.0" }
authors = [{ name = "Subtitld", email = "jbopen@gmail.com" }]
requires-python = ">=3.10"

# No runtime dependencies. The add-on calls Whistle's native engine itself
# (whistle_addon/engine.py), so the cactus-needle package is not a dependency:
# its engine and weights are pinned and verified by tools/fetch_assets.py. The
# engine version is the one cactus-needle 3.2.4 names as its engine
# (ENGINE_VERSIONS[3] = 3.3.1). Audio is decoded by ffmpeg, which the host passes.
dependencies = []

[project.optional-dependencies]
build = ["pyinstaller>=6.10"]
dev = ["pytest>=7.4"]

[project.scripts]
whistle-addon = "whistle_addon.__main__:main"

[tool.setuptools]
packages = ["whistle_addon"]

[tool.pytest.ini_options]
testpaths = ["tests"]
